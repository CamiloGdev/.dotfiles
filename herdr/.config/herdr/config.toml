# herdr configuration managed by dotfiles.
# Linked into ~/.config/herdr/config.toml.

onboarding = false

[theme]
# Use a built-in dark theme with neutral foregrounds so Herdr does not inherit
# Ghostty bright-black selected rows or Kanagawa's warm/yellow label text.
name = "one-dark"

[theme.custom]
# "reset" uses the terminal background so Ghostty's translucency shows through.
panel_bg = "reset"
# panel_bg = "#06080f"
# Match the Gentleman theme, with a muted cyan for Herdr chrome.
accent = "#6FA0AF"
green = "#B7CC85"
blue = "#6FA0AF"
red = "#CB7C94"
yellow = "#DEBA87"

[ui]
accent = "#6FA0AF"

agent_panel_sort = "spaces"
status_indicators = "symbols"
[keys]
# Caps Lock is mapped to Hyper via Karabiner: ctrl+alt+cmd+shift.
prefix = "ctrl+alt+cmd+shift+a"

# Move between agents in the sidebar.
# Avoid Herdr's built-in prefix+shift+j/k pane-swap bindings.
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"

# Jump straight to agent N (1..9) as listed in the sidebar.
focus_agent = "ctrl+alt+cmd+shift+1..9"

[ui.sound]
enabled = true
